# .github/workflows/backup.yml
name: Backup Supabase
on:
  schedule:
    - cron: "0 18 * * 0"   # Sundays 18:00 UTC (Mon 2am Perth)
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install Postgres 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Dump database
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --schema=public --no-owner --file=backup.sql
      - uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup.sql
          retention-days: 30
